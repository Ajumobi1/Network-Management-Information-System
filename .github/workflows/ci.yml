name: NMIS Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nmis-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, production build and PWA smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Production build
        run: pnpm build

      - name: Verify deployment control files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync('dist/version.json','utf8')); JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8'));"
          grep -q "NMIS_BUILD_ID" dist/sw.js
          grep -q "cache: 'no-store'" dist/sw.js
